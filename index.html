<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/fav-theshortpant.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Short Pant — Product Designer</title>
    <meta name="description" content="Portfolio of Kshamanidhi, a product designer in Raipur, India. A product should be clear, honest and consistent. Good design follows." />
    <link rel="canonical" href="https://theshortpant.com/" />

    <!-- Link previews (Open Graph: LinkedIn, WhatsApp, Slack, iMessage, Facebook…).
         Image URLs must be absolute — crawlers don't resolve relative paths. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Short Pant" />
    <meta property="og:url" content="https://theshortpant.com/" />
    <meta property="og:title" content="Kshamanidhi, Product Designer" />
    <meta property="og:description" content="A product should be clear, honest and consistent. Case studies, Figma plugins, motion and illustration by Kshamanidhi, a product designer in Raipur, India." />
    <meta property="og:image" content="https://theshortpant.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Short Pant: A product should be Clear, Honest & Consistent. Good design follows." />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kshamanidhi, Product Designer" />
    <meta name="twitter:description" content="A product should be clear, honest and consistent. Case studies, Figma plugins, motion and illustration by Kshamanidhi." />
    <meta name="twitter:image" content="https://theshortpant.com/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet" />

    <!-- Built pages carry their content pre-rendered in #root (for search
         engines and link scrapers that don't run JavaScript). Visitors get
         the live app instead: the static copy stays invisible until App
         mounts and removes data-prerendered. Without JavaScript, show it. -->
    <style>#root[data-prerendered] { visibility: hidden; }</style>
    <noscript><style>#root[data-prerendered] { visibility: visible; }</style></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
